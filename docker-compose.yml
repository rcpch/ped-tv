services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file: envs/.env
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy

  worker:
    build: .
    command: python manage.py db_worker --no-reload
    volumes:
      - .:/app
    env_file: envs/.env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_DB: pedtv
      POSTGRES_USER: pedtv
      POSTGRES_PASSWORD: pedtv
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedtv"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for local dev (Garage, single node).
  # In production, Azure Blob Storage is used (set STORAGE_BACKEND=azure).
  garage:
    image: docker.io/dxflrs/garage:v2.5.0
    # The image is built FROM scratch (no shell) — exec-form command only.
    #   --single-node     auto-configure a single-node cluster layout
    #   --default-bucket  create the default key + bucket from GARAGE_DEFAULT_*
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      # Must match the AWS_* values in envs/.env (these are the settings.py
      # defaults). Garage accepts arbitrary access-key IDs but requires
      # secret keys of at least 16 characters.
      GARAGE_DEFAULT_ACCESS_KEY: minioadmin
      GARAGE_DEFAULT_SECRET_KEY: minioadminminioadmin
      GARAGE_DEFAULT_BUCKET: pedtv-media
    volumes:
      - garage-data:/var/lib/garage
      - ./garage.toml:/etc/garage.toml:ro
    ports:
      - "9000:9000"  # S3 API (signed requests; used by Django inside Docker)
      - "3902:3902"  # website endpoint (anonymous public media URLs)
    healthcheck:
      # No shell or curl in the image — use the garage CLI over local RPC.
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  garage-data:
